<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>第4頁版面編輯器｜能源轉換（低碳與無碳能源）</title><link rel="stylesheet" href="src/engine/editor.css"></head>
<body class="editing">
<header class="app-header"><div class="project-title"><span class="eyebrow">綠工課程 · 第 4 頁</span><h1>能源轉換（低碳與無碳能源）</h1></div><div class="mode-switch" aria-label="工作模式"><button id="mode-edit" class="selected" aria-pressed="true">編輯版面</button><button id="mode-preview" aria-pressed="false">播放預覽</button></div><div class="header-actions"><span id="save-status" role="status">載入中</span><button id="save-layout">儲存版面</button><button id="export-video" class="primary">輸出影片</button></div></header>
<div class="edit-toolbar"><div class="toolbar-group"><button id="undo" disabled title="Ctrl+Z">復原</button><button id="redo" disabled title="Ctrl+Shift+Z">重做</button><span class="divider"></span><label><input id="snap" type="checkbox" checked>對齊吸附</label><label><input id="grid" type="checkbox">格線</label><label><input id="safe-area" type="checkbox" checked>限制內容區</label></div><div class="toolbar-group"><label for="edit-moment">編輯畫面</label><select id="edit-moment"><option value="0">起始畫面 · 0s</option><option value="3">時間軸 · 3s</option><option value="8">短期替代 · 8s</option><option value="19">碳中和循環 · 19s</option><option value="30">長期轉型 · 30s</option><option value="34" selected>最終落位 · 34s</option></select><label for="zoom">檢視</label><select id="zoom"><option value="fit">符合畫面</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option></select></div></div>
<div class="workspace"><aside class="layers-panel" aria-label="物件清單"><div class="panel-heading"><h2>物件</h2><span id="object-count"></span></div><input id="layer-search" type="search" placeholder="搜尋文字或圖示" aria-label="搜尋物件"><select id="layer-filter" aria-label="物件篩選"><option value="current">本畫面可見</option><option value="all">所有物件</option><option value="text">文字</option><option value="icon">圖示、形狀與連線</option></select><div id="layers" class="layer-list" role="listbox" aria-multiselectable="true"></div><div class="layer-footer"><span title="Ctrl＋點選：選最外層群組；雙擊：選上一層群組">Shift 多選 · Ctrl 選群組 · 雙擊選上層</span><button id="select-none">取消選取</button></div></aside>
<main class="canvas-area" id="canvas-area"><div class="canvas-caption"><span>1920 × 1080</span><span>左側 66.7% 內容區 · 右側保留老師</span></div><div class="stage" id="stage"><img class="corner-guide" id="corner-guide" src="assets/corner-guide.png" alt="" draggable="false"><div class="presenter-zone" id="presenter-zone"><span>老師人像預留區<small>參考線與角飾不會輸出</small></span></div></div><div class="canvas-hint" id="selection-hint">點選或框選物件，拖曳調整位置；方向鍵微調，Shift 加速。</div></main>
<aside class="inspector" aria-label="物件屬性"><div class="panel-heading"><h2>版面與屬性</h2></div><section class="preset-section"><label for="preset">版面起點</label><div class="inline"><select id="preset"><option value="tidy">整理對齊</option><option value="original">原始版面</option><option value="custom" hidden>自訂調整</option></select><button id="apply-preset">套用</button></div></section><div id="empty-selection" class="empty-selection"><span class="selection-symbol" aria-hidden="true">＋</span><p>選取文字或圖示<br><small>就能調整位置、字級與對齊</small></p></div><div id="selection-properties" hidden><section><h3 id="selection-name">已選取</h3><div class="field-grid"><label>X<input id="prop-x" type="number" step="1"></label><label>Y<input id="prop-y" type="number" step="1"></label><label>寬度<input id="prop-width" type="number" min="24" max="1800" step="1"></label><label>縮放 %<input id="prop-scale" type="number" min="20" max="300" step="1"></label><label>旋轉 °<input id="prop-rotation" type="number" min="-360" max="360" step="1"></label></div><div class="inline checks"><label><input id="prop-lock" type="checkbox">鎖定</label><label><input id="prop-hidden" type="checkbox">隱藏</label></div></section><section id="text-properties"><h3>文字</h3><label class="full-field">內容<textarea id="prop-text" rows="3" maxlength="500"></textarea></label><div class="field-grid"><label>字級 pt<input id="prop-font" type="number" min="12" max="100" step="0.5"></label><label>顏色<input id="prop-color" type="color"></label></div><div class="button-row text-align" aria-label="文字框內對齊"><button data-text-align="left">靠左</button><button data-text-align="center">置中</button><button data-text-align="right">靠右</button></div><p class="field-hint">教學文字至少 20 pt（輸出時強制檢查），來源附註可用 12 pt。</p></section><section><h3>物件對齊 <small id="align-reference">依內容區</small></h3><div class="alignment-grid"><button data-align="left">靠左</button><button data-align="centerX">水平置中</button><button data-align="right">靠右</button><button data-align="top">置頂</button><button data-align="centerY">垂直置中</button><button data-align="bottom">置底</button></div><div class="button-row"><button id="distribute-x">水平等距</button><button id="distribute-y">垂直等距</button></div><button id="reset-selected" class="subtle full">還原選取物件</button></section></div><section class="project-tools"><h3>版面檔</h3><button id="download-layout" class="full">匯出版面 JSON</button><button id="import-layout" class="full">匯入已調整的版面</button><button id="reload-layout" class="full">載入已儲存</button><input id="layout-file" type="file" accept=".json,application/json" hidden></section></aside></div>
<footer class="transport"><div class="transport-top"><div class="toolbar-group"><button id="play" class="play-button">播放含老師原音</button><button id="restart">回到開頭</button><label><input id="voice" type="checkbox" checked>老師原音</label><span id="time"></span><span id="phase" class="phase"></span></div><div class="toolbar-group"><label><input id="guide" type="checkbox" checked>版型提示</label><select id="bg" aria-label="預覽底色"><option value="">白底</option><option value="checker">透明格線</option><option value="dark">深底</option></select></div></div><input id="timeline" type="range" min="0" max="36.37" step="0.016683333" value="34" aria-label="時間軸"><div id="chapters"></div></footer>
<section id="export-panel" class="export-panel" hidden aria-label="影片輸出"><div class="export-heading"><strong id="export-title">準備輸出</strong><button id="dismiss-export" aria-label="收起輸出進度">收起</button></div><progress id="export-progress" max="100" value="0"></progress><p id="export-message" role="status"></p><p id="export-warning" class="export-warning" role="note" hidden></p><p class="field-hint">輸出中可繼續編輯；新調整會用於下一次輸出。</p><div id="export-links" class="export-links"></div></section><div id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="auto" src="assets/narration.wav"></audio><script type="module" src="src/app.js"></script></body></html>
